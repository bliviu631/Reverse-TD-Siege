<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Reverse TD: Siege Online</title>
<style>
:root{--ink:#20232a;--paper:#efe6cf;--panel:#f8efd8;--accent:#b64d3b;--gold:#e3b341}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#151821;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}body{padding:10px}.shell{max-width:1180px;margin:auto;background:var(--paper);border:4px solid #0f1117;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px #0008}.top{min-height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(#f6efd9,#e9ddbd);border-bottom:3px solid #2b2e35}.brand{font-weight:1000;text-align:center}.pill{background:#fff9e9;border:2px solid #3e4149;border-radius:999px;padding:7px 10px;font-weight:900;box-shadow:0 3px 0 #3e4149}.right{text-align:right}.canvasWrap{position:relative;background:#9bb86d}canvas{display:block;width:100%;height:auto;touch-action:none}.panel{padding:12px;background:linear-gradient(#dfd0ae,#cdb98e);border-top:3px solid #2b2e35}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,button,input{font:inherit}button{border:3px solid #20232a;border-radius:12px;background:#fff7df;padding:10px;font-weight:900;box-shadow:0 4px 0 #20232a;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #20232a}button:disabled{opacity:.45;filter:grayscale(1)}.overlay{position:fixed;inset:0;background:#111d;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(520px,100%);background:#f7efd9;border:4px solid #111;border-radius:20px;padding:22px;box-shadow:0 14px 0 #0007;text-align:center}.modal h1{margin:0 0 6px;font-size:34px}.stack{display:grid;gap:10px;margin-top:16px}.joinrow{display:grid;grid-template-columns:1fr auto;gap:8px}input{min-width:0;border:3px solid #20232a;border-radius:12px;padding:12px;font-weight:900;text-transform:uppercase}.status{font-weight:800;opacity:.8}.hidden{display:none!important}.invite{word-break:break-all;background:#fff9e9;border:2px dashed #555;padding:10px;border-radius:10px}.role{font-size:14px;text-transform:uppercase;letter-spacing:1px}.result{position:absolute;inset:0;background:#111b;color:#fff;display:grid;place-items:center;text-align:center}.resultBox{background:#f7efd9;color:#20232a;border:4px solid #111;border-radius:20px;padding:24px;min-width:min(400px,85%)}@media(max-width:700px){body{padding:0}.shell{border-radius:0;border-width:0;min-height:100vh}.top{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1;grid-row:1;font-size:18px}.top .left{grid-row:2}.top .right{grid-row:2}.actions{grid-template-columns:repeat(2,1fr)}button{padding:12px 8px}.modal h1{font-size:29px}}
</style></head><body>
<div class="shell"><div class="top"><div class="left"><div class="pill" id="money">Gold 0</div></div><div class="brand">REVERSE TD: SIEGE ONLINE<div class="role" id="roleLabel">not connected</div></div><div class="right"><span class="pill">Castle <span id="hp">240</span></span></div></div><div class="canvasWrap"><canvas id="game" width="1152" height="620"></canvas><div id="result" class="result hidden"><div class="resultBox"><h2 id="resultTitle"></h2><p id="resultText"></p></div></div></div><div class="panel"><div id="actionBar" class="actions"></div><p class="status" id="hint">Create or join a room.</p></div></div>
<div id="home" class="overlay"><div class="modal"><h1>Reverse TD: Siege</h1><p>One phone attacks. The other builds the defence.</p><div class="stack"><button id="create">Create private match</button><div class="joinrow"><input id="code" maxlength="6" placeholder="ROOM CODE"><button id="join">Join</button></div><div class="status" id="homeStatus"></div></div></div></div>
<div id="lobby" class="overlay hidden"><div class="modal"><h1>Private Match</h1><p>You are the <b id="lobbyRole"></b>.</p><div class="invite" id="invite"></div><div class="stack"><button id="share">Share invitation</button><button id="ready">Ready</button><div class="status" id="lobbyStatus">Waiting for the second player...</div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io();let role=null,state=null,code=null,selectedTower='archer';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const PATH=[{x:55,y:75},{x:270,y:75},{x:360,y:145},{x:820,y:145},{x:965,y:225},{x:880,y:330},{x:420,y:330},{x:240,y:430},{x:520,y:530},{x:1025,y:530}];
const SPOTS=[{x:500,y:72},{x:730,y:232},{x:1010,y:340},{x:590,y:410},{x:270,y:350},{x:720,y:590}];
const UNIT={swordsman:{cost:12,icon:'⚔️'},shield:{cost:20,icon:'🛡️'},runner:{cost:16,icon:'🏃'},brute:{cost:32,icon:'🪓'}};
const TOWER={archer:{cost:28,icon:'🏹'},cannon:{cost:46,icon:'💣'}};
function inviteUrl(c){return location.origin+location.pathname+'?room='+c}
function enterLobby(c,r){code=c;role=r;$('home').classList.add('hidden');$('lobby').classList.remove('hidden');$('lobbyRole').textContent=r;$('invite').textContent=inviteUrl(c);$('roleLabel').textContent=r;buildActions()}
$('create').onclick=()=>socket.emit('createRoom',res=>{if(res?.ok)enterLobby(res.code,res.role)});
$('join').onclick=()=>socket.emit('joinRoom',{code:$('code').value});
$('ready').onclick=()=>{socket.emit('ready');$('ready').disabled=true;$('ready').textContent='Ready ✓'};
$('share').onclick=async()=>{const text='Join my Reverse TD match: '+inviteUrl(code);try{if(navigator.share)await navigator.share({title:'Reverse TD invite',text,url:inviteUrl(code)});else{await navigator.clipboard.writeText(inviteUrl(code));$('share').textContent='Link copied ✓'}}catch{}};
socket.on('joined',x=>enterLobby(x.code,x.role));socket.on('joinError',m=>$('homeStatus').textContent=m);
socket.on('state',s=>{state=s;if(s.phase==='playing'){$('lobby').classList.add('hidden')}updateUI();draw()});
const preset=new URLSearchParams(location.search).get('room');if(preset){$('code').value=preset.toUpperCase();socket.emit('joinRoom',{code:preset});}
function buildActions(){const bar=$('actionBar');bar.innerHTML='';if(role==='attacker'){for(const [k,v] of Object.entries(UNIT)){const b=document.createElement('button');b.innerHTML=`${v.icon} ${k}<br><small>${v.cost} gold</small>`;b.onclick=()=>socket.emit('spawnUnit',k);b.dataset.cost=v.cost;bar.appendChild(b)}}else{for(const [k,v] of Object.entries(TOWER)){const b=document.createElement('button');b.innerHTML=`${v.icon} ${k}<br><small>${v.cost} gold</small>`;b.onclick=()=>{selectedTower=k;buildActions();draw()};if(selectedTower===k)b.style.background='#b8d67c';b.dataset.cost=v.cost;bar.appendChild(b)}const note=document.createElement('button');note.textContent='Tap an empty circle on the map';note.disabled=true;bar.appendChild(note)}}
function updateUI(){if(!state)return;const money=role==='attacker'?state.attackerGold:state.defenderGold;$('money').textContent='Gold '+money;$('hp').textContent=state.castleHp;$('lobbyStatus').textContent=`Attacker ${state.connected.attacker?'✓':'…'} · Defender ${state.connected.defender?'✓':'…'} · Ready ${state.ready.attacker&&state.ready.defender?'✓':'…'}`;$('hint').textContent=state.phase==='playing'?(role==='attacker'?'Deploy troops and destroy the castle.':'Select a tower, then tap an empty build circle.'):'Waiting in lobby.';document.querySelectorAll('#actionBar button[data-cost]').forEach(b=>b.disabled=Number(b.dataset.cost)>money||state.phase!=='playing');if(state.phase==='ended'){$('result').classList.remove('hidden');$('resultTitle').textContent=state.winner===role?'Victory':'Defeat';$('resultText').textContent=state.winner==='attacker'?'The castle has fallen.':'The defence held the line.'}}
function pos(d){let r=d;for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],l=Math.hypot(b.x-a.x,b.y-a.y);if(r<=l){const t=r/l;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,a:Math.atan2(b.y-a.y,b.x-a.x)}}r-=l}return PATH.at(-1)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#9bb86d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#4d3d29';ctx.lineWidth=76;ctx.beginPath();PATH.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.strokeStyle='#cdb88a';ctx.lineWidth=62;ctx.stroke();ctx.fillStyle='#60513a';ctx.fillRect(1010,475,112,105);ctx.fillStyle='#ded0a9';ctx.fillRect(1025,490,82,75);ctx.fillStyle='#222';ctx.fillRect(1055,530,22,35);for(let i=0;i<SPOTS.length;i++){const p=SPOTS[i],taken=state?.towers?.some(t=>t.spot===i);ctx.beginPath();ctx.arc(p.x,p.y,25,0,Math.PI*2);ctx.fillStyle=taken?'#77684f':'#d9cfaa';ctx.fill();ctx.strokeStyle='#332f27';ctx.lineWidth=3;ctx.stroke()}for(const t of state?.towers||[]){ctx.fillStyle=t.type==='cannon'?'#3d424c':'#855f36';ctx.fillRect(t.x-16,t.y-18,32,36);ctx.fillStyle='#222';ctx.beginPath();ctx.arc(t.x,t.y-20,10,0,Math.PI*2);ctx.fill()}for(const u of state?.units||[]){const p=pos(u.d);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=u.type==='brute'?'#8f5b40':u.type==='shield'?'#70859e':u.type==='runner'?'#e2c45c':'#ddd';ctx.beginPath();ctx.arc(0,0,u.size,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.stroke();ctx.restore();ctx.fillStyle='#222';ctx.fillRect(p.x-16,p.y-u.size-10,32,4);ctx.fillStyle='#b64d3b';ctx.fillRect(p.x-16,p.y-u.size-10,32*Math.max(0,u.hp/u.maxHp),4)}}
canvas.addEventListener('pointerdown',e=>{if(role!=='defender'||state?.phase!=='playing')return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;let best=-1,bd=38;SPOTS.forEach((p,i)=>{const d=Math.hypot(x-p.x,y-p.y);if(d<bd){best=i;bd=d}});if(best>=0)socket.emit('placeTower',{spot:best,type:selectedTower})});
draw();
</script></body></html>
