
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Reverse TD: Siege</title>
<style>
  :root{
    --ink:#1f2430;
    --paper:#efe6cf;
    --panel:#f7f0dc;
    --panel2:#d7c7a5;
    --accent:#b64d3b;
    --gold:#e3b341;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#151821;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
  body{display:block;padding:16px;overflow:auto}
  #gameShell{
    width:min(1180px,96vw);
    margin:0 auto;
    background:var(--paper);
    border:4px solid #0f1117;
    border-radius:20px;
    box-shadow:0 24px 70px #0008;
    overflow:hidden;
  }
  #topbar{
    position:relative;
    z-index:20;
    min-height:72px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:16px;
    padding:0 18px;
    border-bottom:3px solid #2b2e35;
    background:linear-gradient(#f6efd9,#e9ddbd);
  }
  .moneyBox{
    justify-self:start;
    min-width:120px;
    font-size:18px;
    background:#fff4c7;
  }
  .brand{font-size:24px;font-weight:900;letter-spacing:.5px;justify-self:center}
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;justify-self:end}
  .pill{
    background:#fff9e9;
    border:2px solid #3e4149;
    border-radius:999px;
    padding:8px 12px;
    font-weight:800;
    box-shadow:0 3px 0 #3e4149;
  }
  #canvasWrap{position:relative;background:#9bb86d}
  canvas{display:block;width:100%;height:auto}
  #message{
    position:absolute;inset:0;display:none;place-items:center;
    background:#1119;color:white;text-align:center;padding:24px;
  }
  #message .card{
    background:#f7efd9;color:#20232a;border:4px solid #111;border-radius:20px;
    padding:26px 30px;min-width:min(420px,85%);
    box-shadow:0 14px 0 #1117;
  }
  #message h2{font-size:38px;margin:0 0 10px}
  #message p{margin:0 0 18px;font-size:17px}
  button{
    font:inherit;font-weight:900;cursor:pointer;border:3px solid #20232a;
    background:#fff7df;border-radius:12px;padding:10px 16px;
    box-shadow:0 4px 0 #20232a;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #20232a}
  #unitbar{
    display:grid;grid-template-columns:repeat(4,1fr) 180px;
    gap:10px;padding:12px;border-top:3px solid #2b2e35;
    background:linear-gradient(#dfd0ae,#cdb98e);
  }
  .unit{
    position:relative;min-height:108px;text-align:left;padding:10px 12px 10px 72px;
    background:#f8efd8;
  }
  .unit.locked{filter:grayscale(1);opacity:.55}
  .unit .icon{
    position:absolute;left:10px;top:10px;width:50px;height:50px;border:2px solid #2c2f35;
    border-radius:10px;display:grid;place-items:center;background:#fff8e5;font-size:28px;
  }
  .unit strong{display:block;font-size:16px}
  .unit small{display:block;margin-top:3px;opacity:.75;font-weight:700}
  .unit .statsLine{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:7px;
    font-size:12px;
    font-weight:900;
  }
  .unit .stat{
    background:#e7dcc1;
    border:1px solid #4b4d53;
    border-radius:6px;
    padding:2px 5px;
  }
  .unit .cost{position:absolute;right:10px;bottom:8px;color:#7a4c00}
  #controls{display:grid;gap:8px}
  #startBtn{background:#b8d67c}
  #speedBtn{background:#f4df91}
  @media (max-width:800px){
    #unitbar{grid-template-columns:repeat(2,1fr)}
    #controls{grid-column:1/-1;grid-template-columns:1fr 1fr}
    .brand{font-size:18px}
    .pill{padding:6px 9px;font-size:13px}
  }
</style>
</head>
<body>
<div id="gameShell">
  <div id="topbar">
    <div class="pill moneyBox">Money: <span id="gold">60</span></div>
    <div class="brand">REVERSE TD: SIEGE</div>
    <div class="stats">
      <div class="pill">Castle <span id="castleHp">220</span></div>
      <div class="pill">Lives <span id="lives">15</span></div>
    </div>
  </div>

  <div id="canvasWrap">
<div id="towerTooltip" style="
position:absolute;
display:none;
pointer-events:none;
background:#fff7df;
border:2px solid #222;
border-radius:8px;
padding:6px 10px;
font-weight:700;
box-shadow:0 4px 10px rgba(0,0,0,.25);
z-index:30;
"></div>
    <canvas id="game" width="1152" height="620"></canvas>
    <div id="message"><div class="card">
      <h2 id="messageTitle">Victory</h2>
      <p id="messageText"></p>
      <button id="restartBtn">Play again</button>
    </div></div>
  </div>

  <div id="unitbar">
    <button class="unit" data-unit="swordsman">
      <span class="icon">⚔️</span>
      <strong>Swordsman</strong><span class="statsLine"><span class="stat">HP 55</span><span class="stat">SPD 58</span><span class="stat">DMG 12</span></span>
      <span class="cost">12 gold</span>
    </button>
    <button class="unit" data-unit="shield">
      <span class="icon">🛡️</span>
      <strong>Shieldbearer</strong><span class="statsLine"><span class="stat">HP 120</span><span class="stat">SPD 36</span><span class="stat">DMG 9</span></span>
      <span class="cost">20 gold</span>
    </button>
    <button class="unit" data-unit="runner">
      <span class="icon">🏃</span>
      <strong>Runner</strong><span class="statsLine"><span class="stat">HP 38</span><span class="stat">SPD 92</span><span class="stat">DMG 8</span></span>
      <span class="cost">16 gold</span>
    </button>
    <button class="unit" data-unit="brute">
      <span class="icon">🪓</span>
      <strong>Brute</strong><span class="statsLine"><span class="stat">HP 180</span><span class="stat">SPD 28</span><span class="stat">DMG 30</span></span>
      <span class="cost">32 gold</span>
    </button>
    <div id="controls">
      <button id="startBtn">Launch raid</button>
      <button id="speedBtn">Speed ×1</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const goldEl = document.getElementById('gold');
  const hpEl = document.getElementById('castleHp');
  const livesEl = document.getElementById('lives');
  const startBtn = document.getElementById('startBtn');
  const speedBtn = document.getElementById('speedBtn');
  const msg = document.getElementById('message');
  const msgTitle = document.getElementById('messageTitle');
  const msgText = document.getElementById('messageText');
  const restartBtn = document.getElementById('restartBtn');
  const tooltip = document.getElementById('towerTooltip');
  const canvasWrap = document.getElementById('canvasWrap');

  const W = canvas.width, H = canvas.height;
  const path = [
    {x:55,y:75},{x:270,y:75},{x:360,y:145},{x:820,y:145},
    {x:965,y:225},{x:880,y:330},{x:420,y:330},
    {x:240,y:430},{x:520,y:530},{x:1025,y:530}
  ];

  const towerSpots = [
    {x:500,y:72},    // above the upper road
    {x:730,y:232},   // below the upper road
    {x:1010,y:340},  // right of the descending road
    {x:590,y:410},   // below the middle road
    {x:270,y:350},   // above the lower-left bend
    {x:720,y:590}    // below the final road
  ];

  const unitTypes = {
    swordsman:{cost:12,hp:55,speed:58,damage:12,size:12,accent:'#d7d7d7'},
    shield:{cost:20,hp:120,speed:36,damage:9,size:14,accent:'#8aa0b8'},
    runner:{cost:16,hp:38,speed:92,damage:8,size:10,accent:'#e4c76f'},
    brute:{cost:32,hp:180,speed:28,damage:30,size:17,accent:'#9d6a4c'}
  };

  const towers = towerSpots.map((p,i)=>({
    ...p, range:145, fireRate:i%3===0?1.15:0.9, cooldown:Math.random(), damage:i%3===0?18:12
  }));

  let gold, castleHp, lives, units, projectiles, started, ended, speedMultiplier, spawnQueue, lastTime, goldTimer;

  function reset(){
    gold=60; castleHp=220; lives=15; units=[]; projectiles=[];
    started=false; ended=false; speedMultiplier=1; spawnQueue=[]; lastTime=performance.now(); goldTimer=0;
    msg.style.display='none'; startBtn.textContent='Launch raid'; speedBtn.textContent='Speed ×1';
    syncUI();
  }

  function pathLength(){
    let L=0;
    for(let i=0;i<path.length-1;i++) L += Math.hypot(path[i+1].x-path[i].x,path[i+1].y-path[i].y);
    return L;
  }
  const totalPath = pathLength();

  function posOnPath(d){
    let remain=d;
    for(let i=0;i<path.length-1;i++){
      const a=path[i], b=path[i+1];
      const seg=Math.hypot(b.x-a.x,b.y-a.y);
      if(remain<=seg){
        const t=remain/seg;
        return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,angle:Math.atan2(b.y-a.y,b.x-a.x),done:false};
      }
      remain-=seg;
    }
    const b=path[path.length-1];
    return {x:b.x,y:b.y,angle:0,done:true};
  }

  function queueUnit(type){
    if(!started || ended) return;
    const spec=unitTypes[type];
    if(gold < spec.cost) return;
    gold -= spec.cost;
    spawnQueue.push({type,delay:0.08});
    syncUI();
  }

  document.querySelectorAll('.unit').forEach(btn=>{
    btn.addEventListener('click',()=>queueUnit(btn.dataset.unit));
  });

  startBtn.addEventListener('click',()=>{
    if(ended) return;
    started=!started;
    startBtn.textContent=started?'Pause':'Launch raid';
  });

  speedBtn.addEventListener('click',()=>{
    speedMultiplier = speedMultiplier===1 ? 2 : speedMultiplier===2 ? 3 : 1;
    speedBtn.textContent=`Speed ×${speedMultiplier}`;
  });

  restartBtn.addEventListener('click',reset);

  function spawn(type){
    const s=unitTypes[type];
    units.push({
      type,d:0,hp:s.hp,maxHp:s.hp,speed:s.speed,damage:s.damage,size:s.size,
      hitFlash:0,attackTimer:0,seed:Math.random()*1000
    });
  }

  function update(dt){
    if(!started || ended) return;
    dt *= speedMultiplier;
    goldTimer += dt;
    while(goldTimer>=1){ gold += 4; goldTimer -= 1; }

    if(spawnQueue.length){
      spawnQueue[0].delay -= dt;
      if(spawnQueue[0].delay<=0){
        spawn(spawnQueue[0].type); spawnQueue.shift();
      }
    }

    for(const u of units){
      u.hitFlash=Math.max(0,u.hitFlash-dt*5);
      u.d += u.speed*dt;
      if(u.d>=totalPath){
        castleHp -= u.damage;
        u.dead=true;
      }
    }

    for(const t of towers){
      t.cooldown -= dt;
      if(t.cooldown<=0){
        let target=null, best=-Infinity;
        for(const u of units){
          if(u.dead) continue;
          const p=posOnPath(u.d);
          const dist=Math.hypot(p.x-t.x,p.y-t.y);
          if(dist<=t.range && u.d>best){target=u;best=u.d;}
        }
        if(target){
          projectiles.push({x:t.x,y:t.y,target,speed:420,damage:t.damage});
          t.cooldown=1/t.fireRate;
        }
      }
    }

    for(const p of projectiles){
      if(p.target.dead){p.dead=true;continue;}
      const tp=posOnPath(p.target.d);
      const dx=tp.x-p.x,dy=tp.y-p.y,dist=Math.hypot(dx,dy)||1;
      const step=p.speed*dt;
      if(dist<=step+5){
        p.target.hp-=p.damage;
        p.target.hitFlash=1;
        p.dead=true;
        if(p.target.hp<=0){
          p.target.dead=true;
          gold += 2;
          lives--;
        }
      } else {
        p.x += dx/dist*step;
        p.y += dy/dist*step;
      }
    }

    units=units.filter(u=>!u.dead);
    projectiles=projectiles.filter(p=>!p.dead);

    if(castleHp<=0) endGame(true);
    else if(lives<=0) endGame(false);

    syncUI();
  }

  function endGame(win){
    ended=true; started=false;
    msgTitle.textContent=win?'Victory!':'Raid failed';
    msgText.textContent=win?'The castle gate has fallen. The road belongs to you.':'Too many soldiers were lost before the walls broke.';
    msg.style.display='grid';
  }

  function syncUI(){
    goldEl.textContent=Math.max(0,Math.floor(gold));
    hpEl.textContent=Math.max(0,Math.ceil(castleHp));
    livesEl.textContent=Math.max(0,lives);
    document.querySelectorAll('.unit').forEach(btn=>{
      const s=unitTypes[btn.dataset.unit];
      btn.classList.toggle('locked',gold<s.cost || !started || ended);
    });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawGround();
    drawPath();
    drawScenery();
    drawBase();
    drawCastle();
    towers.forEach(drawTower);
    units.forEach(drawUnit);
    projectiles.forEach(drawProjectile);
  }

  function drawGround(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#acc777'); g.addColorStop(1,'#8eac62');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=.22;
    for(let i=0;i<130;i++){
      const x=(i*97)%W, y=(i*67)%H;
      ctx.strokeStyle=i%2?'#4d6d38':'#d4e2a7';
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(x,y+5);ctx.lineTo(x+3,y-4);
      ctx.moveTo(x+4,y+5);ctx.lineTo(x+7,y-3);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  function drawPath(){
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='#6e5a38';ctx.lineWidth=66;
    ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);
    path.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();

    ctx.strokeStyle='#c7a66f';ctx.lineWidth=58;ctx.stroke();
    ctx.strokeStyle='#d9bc86';ctx.lineWidth=44;ctx.stroke();

    ctx.setLineDash([4,14]);ctx.strokeStyle='#8b7048';ctx.lineWidth=2;ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawScenery(){
    const rocks=[[150,185,18],[1040,115,16],[955,410,20],[110,500,15],[430,220,13],[760,470,12]];
    rocks.forEach(([x,y,r])=>{
      ctx.fillStyle='#7c817e';ctx.beginPath();ctx.ellipse(x,y,r,r*.7,-.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#aeb1ae';ctx.beginPath();ctx.ellipse(x-4,y-4,r*.45,r*.25,-.2,0,Math.PI*2);ctx.fill();
    });

    const trees=[[130,300],[1000,285],[1060,350],[205,550],[430,585],[880,85],[305,220]];
    trees.forEach(([x,y],i)=>{
      ctx.fillStyle='#6f4b2e';ctx.fillRect(x-5,y,10,24);
      ctx.fillStyle=i%2?'#486d3c':'#587c44';
      ctx.beginPath();ctx.arc(x,y-4,19,0,Math.PI*2);ctx.arc(x-13,y+4,14,0,Math.PI*2);ctx.arc(x+13,y+5,14,0,Math.PI*2);ctx.fill();
    });

    for(const [x,y] of [[80,220],[560,70],[900,590],[720,275],[380,470]]){
      ctx.strokeStyle='#6d8c4b';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x,y+10);ctx.lineTo(x,y);ctx.moveTo(x,y+5);ctx.lineTo(x-7,y+1);ctx.moveTo(x,y+5);ctx.lineTo(x+7,y+1);ctx.stroke();
      ctx.fillStyle='#efe8c3';ctx.beginPath();ctx.arc(x,y-2,3,0,Math.PI*2);ctx.fill();
    }
  }

  function drawBase(){
    ctx.save();ctx.translate(58,75);
    ctx.fillStyle='#5e3c25';ctx.fillRect(-28,14,58,20);
    ctx.fillStyle='#b24737';ctx.beginPath();ctx.moveTo(-36,14);ctx.lineTo(0,-28);ctx.lineTo(36,14);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#2b241e';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#f0c36a';ctx.fillRect(-5,-1,10,13);
    ctx.restore();
  }

  function drawCastle(){
    ctx.save();ctx.translate(1030,530);
    ctx.fillStyle='#777b80';ctx.strokeStyle='#2b2e34';ctx.lineWidth=4;
    ctx.fillRect(-42,-48,84,68);ctx.strokeRect(-42,-48,84,68);
    ctx.fillRect(-58,-70,28,90);ctx.strokeRect(-58,-70,28,90);
    ctx.fillRect(30,-70,28,90);ctx.strokeRect(30,-70,28,90);
    [-58,-44,-30,30,44].forEach(x=>ctx.fillRect(x,-82,12,15));
    ctx.fillStyle='#302922';ctx.fillRect(-12,-14,24,34);
    ctx.fillStyle='#b64d3b';ctx.fillRect(0,-112,4,30);ctx.beginPath();ctx.moveTo(4,-112);ctx.lineTo(31,-103);ctx.lineTo(4,-94);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  function drawTower(t){
    ctx.save();ctx.translate(t.x,t.y);
    ctx.fillStyle='#82765e';ctx.strokeStyle='#3d372d';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(0,18,30,13,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#6f7178';ctx.strokeStyle='#26292e';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#969aa0';ctx.fillRect(-14,-18,28,36);ctx.strokeRect(-14,-18,28,36);
    ctx.fillStyle='#4a3426';ctx.fillRect(-4,-27,8,20);
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,-28,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawUnit(u){
    const p=posOnPath(u.d);
    ctx.save();
    ctx.translate(p.x,p.y);
    // Keep stickmen upright. Flip horizontally when moving left instead of rotating upside down.
    const movingLeft = Math.cos(p.angle) < 0;
    if(movingLeft){
      ctx.scale(-1,1);
    }
    ctx.globalAlpha=.2;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,15,u.size,5,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=u.hitFlash?'#fff':'#1b1b1b';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,-12,u.size*.42,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,8);ctx.moveTo(0,-1);ctx.lineTo(-u.size*.8,4);ctx.moveTo(0,-1);ctx.lineTo(u.size*.9,1);ctx.moveTo(0,8);ctx.lineTo(-u.size*.55,17);ctx.moveTo(0,8);ctx.lineTo(u.size*.55,17);ctx.stroke();
    ctx.fillStyle=unitTypes[u.type].accent;ctx.fillRect(-u.size*.5,-5,u.size,8);
    if(u.type==='shield'){
      ctx.fillStyle='#8aa0b8';ctx.strokeStyle='#1b1b1b';ctx.beginPath();ctx.ellipse(10,1,8,12,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    } else if(u.type==='brute'){
      ctx.strokeStyle='#4d2d1d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,-1);ctx.lineTo(17,-10);ctx.stroke();
    } else {
      ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(16,-8);ctx.stroke();
    }
    const w=30;ctx.fillStyle='#4a1b1b';ctx.fillRect(-w/2,-30,w,4);
    ctx.fillStyle='#78b75c';ctx.fillRect(-w/2,-30,w*(u.hp/u.maxHp),4);
    ctx.restore();
  }

  function drawProjectile(p){
    ctx.fillStyle='#20242a';
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
  }

  function loop(now){
    const dt=Math.min(.033,(now-lastTime)/1000);lastTime=now;
    update(dt);draw();requestAnimationFrame(loop);
  }


  canvas.addEventListener('mousemove',(e)=>{
    const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width, sy=canvas.height/r.height;
    const mx=(e.clientX-r.left)*sx;
    const my=(e.clientY-r.top)*sy;

    let found=null;
    for(const t of towers){
      if(Math.hypot(mx-t.x,my-t.y)<24){ found=t; break; }
    }

    if(found){
      tooltip.style.display='block';
      tooltip.style.left=(e.clientX-r.left+14)+'px';
      tooltip.style.top=(e.clientY-r.top-8)+'px';
      tooltip.textContent=`Damage: ${found.damage}`;
    }else{
      tooltip.style.display='none';
    }
  });

  canvas.addEventListener('mouseleave',()=>tooltip.style.display='none');


  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
